name: ESP32 firmware build
on:
  push:
  pull_request:
jobs:
  esp-idf:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.4
    steps:
      - uses: actions/checkout@v4
      - name: Build for original ESP32-WROOM-32
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32
          idf.py build
      - name: Reject legacy DAC constructor in experimental firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          if xtensa-esp32-elf-nm build/cyd_100_percent_clock.elf | grep -q 'check_dac_legacy_driver_conflict'; then
            echo 'ERROR: Legacy DAC constructor linked: would abort at boot with dac_oneshot.'
            exit 1
          fi
          echo 'Verified: no legacy DAC startup conflict constructor linked.'
      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cyd-100-percent-clock-esp32
          path: |
            build/cyd_100_percent_clock.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
